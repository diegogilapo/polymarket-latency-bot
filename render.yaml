services:
  - type: web
    name: polymarket-latency-bot
    env: python
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SIMULATION_MODE
        value: "True"
      - key: SIMULATION_INITIAL_BALANCE
        value: "1000.0"
      - key: SIMULATED_NETWORK_LATENCY_MS
        value: "15"
      - key: MAX_COMBINED_ASK_SUM
        value: "0.992"
      - key: MIN_PARITY_PROFIT_PCT
        value: "0.008"
      - key: ORDER_SIZE_USDC
        value: "50.0"
      - key: MIN_SHARE_DEPTH
        value: "10.0"
      - key: MONITORED_ASSETS
        value: "BTC,ETH,SOL,DOGE,XRP"
      - key: POLYMARKET_SEARCH_KEYWORDS
        value: "Bitcoin,BTC,Ethereum,ETH,Solana,SOL,Dogecoin,DOGE,XRP,Crypto,Price,Hit,Reach,Above"
