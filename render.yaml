services:
  - type: web
    name: polymarket-latency-bot
    env: python
    region: virginia
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SIMULATION_MODE
        value: "True"
      - key: SIMULATION_INITIAL_BALANCE
        value: "1000.0"
      - key: SIMULATED_NETWORK_LATENCY_MS
        value: "15"
      - key: TARGET_SPREAD_CENTS
        value: "0.030"
      - key: MIN_SPREAD_CENTS
        value: "0.018"
      - key: ORDER_SIZE_USDC
        value: "50.0"
      - key: MAX_ORDER_SIZE_USDC
        value: "250.0"
      - key: MAX_INVENTORY_PER_MARKET
        value: "300.0"
      - key: INVENTORY_SKEW_FACTOR
        value: "0.00008"
      - key: FAST_VOLATILITY_CANCEL_PCT
        value: "0.0015"
      - key: MONITORED_ASSETS
        value: "BTC,ETH,SOL,DOGE,XRP"
      - key: POLYMARKET_SEARCH_KEYWORDS
        value: "Bitcoin,BTC,Ethereum,ETH,Solana,SOL,Dogecoin,DOGE,XRP,Crypto,Price,Hit,Reach,Above"
