services:
  - type: web
    name: polymarket-latency-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SIMULATION_MODE
        value: "False"
      - key: SIMULATION_INITIAL_BALANCE
        value: "1000.0"
      - key: POLYMARKET_FUNDER_ADDRESS
        value: "0x2cfbE9d9A2D40dA2180aBf14977f1cCF9A5144F9"
      - key: POLYMARKET_SIGNATURE_TYPE
        value: "0"
      - key: SIMULATED_NETWORK_LATENCY_MS
        value: "15"
      - key: TARGET_SPREAD_CENTS
        value: "0.030"
      - key: MIN_SPREAD_CENTS
        value: "0.018"
      - key: AUTO_COMPOUNDING
        value: "True"
      - key: COMPOUNDING_ALLOCATION_PCT
        value: "0.08"
      - key: MIN_ORDER_SIZE_USDC
        value: "15.0"
      - key: MAX_ORDER_SIZE_USDC
        value: "1500.0"
      - key: ORDER_SIZE_USDC
        value: "15.0"
      - key: MAX_TOTAL_EXPOSURE_PCT
        value: "0.70"
      - key: MAX_INVENTORY_PER_MARKET
        value: "1000.0"
      - key: INVENTORY_SKEW_FACTOR
        value: "0.00008"
      - key: FAST_VOLATILITY_CANCEL_PCT
        value: "0.0015"
      - key: MONITORED_ASSETS
        value: "BTC,ETH,SOL,DOGE,XRP,ADA,AVAX,LINK,BNB,NEAR,SUI,PEPE,SHIB,LTC,DOT"
      - key: POLYMARKET_SEARCH_KEYWORDS
        value: "Bitcoin,BTC,Ethereum,ETH,Solana,SOL,Dogecoin,DOGE,XRP,Cardano,ADA,Avalanche,AVAX,Chainlink,LINK,BNB,Near,Sui,Pepe,Shiba,SHIB,Litecoin,LTC,Polkadot,DOT,Crypto,Price,Hit,Reach,Above,Dip"
